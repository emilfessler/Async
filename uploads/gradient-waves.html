    const canvas=document.getElementById('gradient');
    const gl=canvas.getContext('webgl',{antialias:false,alpha:false});
    if(!gl) throw new Error('WebGL indisponible');
    const vertex=`
      attribute vec2 position;
      varying vec2 vUv;
      void main(){vUv=position*.5+.5;gl_Position=vec4(position,0.,1.);}
    `;
    const fragment=`
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D image;
      uniform vec2 resolution;
      uniform vec2 imageResolution;
      uniform float time;
      uniform float strength;
      void main(){
        vec2 uv=vUv;uv.y=1.0-uv.y;
        float screenRatio=resolution.x/resolution.y;
        float imageRatio=imageResolution.x/imageResolution.y;
        vec2 span=screenRatio>imageRatio?vec2(1.0,imageRatio/screenRatio):vec2(screenRatio/imageRatio,1.0);
        vec2 texUv=(uv-.5)*span+.5;
        // Onde progressive : elle naît à gauche et se déplace vers la droite.
        // Le décalage vertical évite un mouvement trop mécanique.
        float travel=texUv.x*7.0-time*.62+texUv.y*.55;
        float envelope=smoothstep(-.08,.12,texUv.x)*(1.0-smoothstep(.92,1.08,texUv.x));
        float wave=sin(travel);
        float secondary=sin(travel*.53-1.2);
        texUv.x-=(wave*.82+secondary*.18)*strength*envelope;
        texUv.y+=cos(travel*.72)*strength*.10*envelope;
        vec3 color=texture2D(image,clamp(texUv,.001,.999)).rgb;
        gl_FragColor=vec4(color,1.0);
      }

      return shader;
    }
    const program=gl.createProgram();
    gl.attachShader(program,compile(gl.VERTEX_SHADER,vertex));
    gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fragment));
    gl.linkProgram(program);
    if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);
    const buffer=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);

    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);
    const u={

      imageResolution:gl.getUniformLocation(program,'imageResolution'),
      time:gl.getUniformLocation(program,'time'),
      strength:gl.getUniformLocation(program,'strength')

    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    const picture=new Image();let ready=false;
    picture.onload=()=>{
      gl.bindTexture(gl.TEXTURE_2D,texture);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,picture);
      gl.uniform2f(u.imageResolution,picture.naturalWidth,picture.naturalHeight);
      ready=true;
    };
    picture.src=sourceImage;
    const state={motion:.0035,paused:false,elapsed:0,previous:performance.now()};
    const motion=document.getElementById('motion');
    motion.addEventListener('input',()=>state.motion=Number(motion.value));
    document.getElementById('pause').addEventListener('click',event=>{
      state.paused=!state.paused;
      event.currentTarget.textContent=state.paused?'Reprendre':'Pause';
    });
    function resize(){
      const dpr=Math.min(devicePixelRatio,2),width=Math.round(innerWidth*dpr),height=Math.round(innerHeight*dpr);
      if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;gl.viewport(0,0,width,height);}
    }
    const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
    function render(now){
      resize();
      const dt=Math.min((now-state.previous)/1000,.05);state.previous=now;
      if(!state.paused&&!reduceMotion)state.elapsed+=dt;
      if(ready){
        gl.uniform2f(u.resolution,canvas.width,canvas.height);
        gl.uniform1f(u.time,state.elapsed);
        gl.uniform1f(u.strength,reduceMotion?0:state.motion);
        gl.drawArrays(gl.TRIANGLES,0,3);
      }
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
